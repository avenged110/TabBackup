<html>
<head>
<meta charset="utf-8">
<title>TabBackup Import</title>
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font: 13px -apple-system, system-ui, sans-serif; text-align: center; padding: 0 16px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #292a2d; color: #e8eaed; } }
  button { width: 200px; height: 24px; padding: 0 12px; font: inherit; font-size: 13px; font-weight: 500; border: none; border-radius: 6px; cursor: default; background: linear-gradient(#3a85f7, #1f6ef0); color: #fff; box-shadow: inset 0 0.5px 0 rgba(255,255,255,.25), 0 0 0 0.5px rgba(0,0,0,.12), 0 0.5px 1.5px rgba(0,0,0,.2); }
  button:active { background: linear-gradient(#2a6fe0, #155ad4); }
  p { margin: 0; color: #888; }
  .err { color: #d93025; }
  .ok { color: #1fa34a; }
</style>
</head>
<body>
  <button id="choose">Choose File…</button>
  <p id="msg">Select a Tab URLs .txt file</p>
  <input id="file" type="file" accept=".txt" hidden>
  <script src="format.js"></script>
  <script src="import.js"></script>
</body>
</html>
